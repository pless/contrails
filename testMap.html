<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Simple Map</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100vh;
      width: 100vw;
      display: block;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Minimal global initMap function for Google Maps API callback
    window.initMap = function() {
      new google.maps.Map(document.getElementById('map'), {
        center: { lat: 38.9, lng: -77.04 },
        zoom: 4,
        mapId: '2e6d1e173674445b90e0edd1'
      });
    };
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCLGA1rjtMfRoIqPmpcqT8Pw_S_oCttw3g&callback=initMap" loading="async"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Image ↔ Map Point Matcher</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #container { display: flex; height: 80vh; }
    #imageContainer, #map { flex: 1; }
    #output { height: 20vh; overflow: auto; padding: 10px; background: #f0f0f0; font-family: monospace; }
    canvas { width: 100%; height: 100%; cursor: crosshair; }
  </style>
</head>
<body>
  <div id="container">
    <div id="imageContainer"><canvas id="imageCanvas"></canvas></div>
    <div id="map"></div>
  </div>
  <div id="output"><b>Click points on image and map:</b><br></div>

  <script>
    // --- Load and setup canvas ---
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const output = document.getElementById('output');
    let imagePoints = [];
    let mapPoints = [];

    const img = new Image();

    img.src = 'https://f5.aos.wisc.edu/webcam_movies/latest_west_1024x768.jpg'; // Replace with your image
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
    };

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = Math.round((e.clientX - rect.left) * canvas.width / canvas.clientWidth);
      const y = Math.round((e.clientY - rect.top) * canvas.height / canvas.clientHeight);
      imagePoints.push([x, y]);
      checkMatch();
    });

    function addToOutput(text) {
      output.innerHTML += text + "<br>";
      output.scrollTop = output.scrollHeight;
    }

    function checkMatch() {
      if (imagePoints.length > mapPoints.length) {
        addToOutput(`Image point: (${imagePoints.at(-1)})`);
      } else if (mapPoints.length > imagePoints.length) {
        addToOutput(`Map point: (${mapPoints.at(-1)})`);
      } else {
        const iPt = imagePoints.at(-1);
        const mPt = mapPoints.at(-1);
        addToOutput(`PAIR ${imagePoints.length}: Image(${iPt}) ↔ Map(${mPt})`);
      }
    }

    // --- Load Google Map ---
    let map;
    function initMap() {
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 38.9, lng: -77.04 },
        zoom: 4,
      });

      map.addListener('click', (e) => {
        const lat = e.latLng.lat().toFixed(6);
        const lng = e.latLng.lng().toFixed(6);
        mapPoints.push([lat, lng]);
        new google.maps.Marker({ position: e.latLng, map: map });
        checkMatch();
      });
    }
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCLGA1rjtMfRoIqPmpcqT8Pw_S_oCttw3g&callback=initMap&loading=async"></script>
</body>
</html>

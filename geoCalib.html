<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Image ↔ Map Point Matcher (Final)</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #upper {
        flex: 1;
        display: flex;
      }
      /* Image pane: keep aspect ratio centered */
      #imageContainer {
        flex: 1;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      #imageContainer canvas {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        cursor: crosshair;
        display: block;
      }
      /* Map pane: full flex */
      #map {
        flex: 1;
        position: relative;
        cursor: crosshair;
      }
      /* Loupe */
      //    #magnifierCanvas {
      //      position: absolute; width: 70px; height: 70px;
      //      border: 2px solid #333; border-radius: 50%;
      //      pointer-events: none; display: none; z-index: 10;
      //    }
      #magnifierCanvas {
        position: absolute;
        width: 50px;
        height: 50px;
        border: 2px solid #333;
        border-radius: 50%;
        pointer-events: none;
        display: none;
        z-index: 10;
        transform: translate(-50%, -50%);
      }
      /* Bottom panel */
      #panel {
        height: 20vh;
        overflow-y: auto;
        border-top: 1px solid #ccc;
        padding: 8px;
        box-sizing: border-box;
      }
      #matches {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      #matches th,
      #matches td {
        border: 1px solid #ddd;
        padding: 4px;
        text-align: center;
      }
      #matches th {
        background: #f0f0f0;
      }
      .btn {
        cursor: pointer;
        padding: 2px 6px;
        margin: 0 2px;
      }
    </style>
  </head>
  <body>
    <div id="upper">
      <div id="imageContainer">
        <canvas id="imageCanvas"></canvas>
        <canvas id="magnifierCanvas"></canvas>
      </div>
      <div id="map"></div>
    </div>
    <div id="panel">
      <div id="controls">
        <input
          type="text"
          id="imageUrlInput"
          placeholder="Enter Image URL"
          style="width: 300px"
        />
        <button id="loadImageBtn">Load Image</button>
        <button id="calibrateApiBtn">Calibrate with API</button>
        <button id="exportBtn">Export JSON</button>
        <button id="exportCsvBtn">Export CSV</button>
        <button id="importBtn">Import JSON/CSV</button>
        <input
          type="file"
          id="importFile"
          style="display: none"
          accept=".json,.csv"
        />
      </div>
      <table id="matches">
        <thead>
          <tr>
            <th>#</th>
            <th>Image Pt</th>
            <th>Map Pt</th>
            <th>API Reprojected</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
      // Ensure loupe canvas exists
      if (!document.getElementById("magnifierCanvas")) {
        const mag = document.createElement("canvas");
        mag.id = "magnifierCanvas";
        document.getElementById("imageContainer").appendChild(mag);
      }
      const canvas = document.getElementById("imageCanvas");
      const ctx = canvas.getContext("2d");
      const magCanvas = document.getElementById("magnifierCanvas");
      const mgCtx = magCanvas.getContext("2d");
      const mapContainer = document.getElementById("map");
      const exportBtn = document.getElementById("exportBtn");
      const exportCsvBtn = document.getElementById("exportCsvBtn");
      const importBtn = document.getElementById("importBtn");
      const importFile = document.getElementById("importFile");
      const tbody = document.querySelector("#matches tbody");

      let matches = [];
      let editing = null;
      const colors = [
        "#e41a1c",
        "#377eb8",
        "#4daf4a",
        "#984ea3",
        "#ff7f00",
        "#ffff33",
        "#a65628",
        "#f781bf",
        "#999999",
        "#66c2a5",
      ];

      // Loupe settings
      const magSize = 50,
        zoom = 3;
      magCanvas.width = magSize;
      magCanvas.height = magSize;

      // Load image
      const img = new Image();
      const loadImageBtn = document.getElementById("loadImageBtn");
      const imageUrlInput = document.getElementById("imageUrlInput");

      const savedImageUrl = localStorage.getItem("lastImageUrl");
      const initialUrl =
        savedImageUrl ||
        "https://metobs.ssec.wisc.edu/pub/cache/aoss/cameras/northwest/latest_orig.jpg";
      imageUrlInput.value = initialUrl;
      img.src = initialUrl;

      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        draw();
      };

      loadImageBtn.addEventListener("click", () => {
        const newUrl = imageUrlInput.value.trim();
        if (newUrl) {
          img.src = newUrl;
          localStorage.setItem("lastImageUrl", newUrl);
        }
      });

      // Image click
      canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = Math.round(
          ((e.clientX - rect.left) * canvas.width) / rect.width
        );
        const y = Math.round(
          ((e.clientY - rect.top) * canvas.height) / rect.height
        );
        handleImgClick([x, y]);
      });

      // Loupe on hover
      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = ((e.clientX - rect.left) * canvas.width) / rect.width;
        const y = ((e.clientY - rect.top) * canvas.height) / rect.height;
        magCanvas.style.display = "block";
        const sw = magSize / zoom;
        const sx = x - sw / 2,
          sy = y - sw / 2;
        mgCtx.clearRect(0, 0, magSize, magSize);
        mgCtx.drawImage(canvas, sx, sy, sw, sw, 0, 0, magSize, magSize);
        mgCtx.strokeStyle = "rgba(0,0,0,0.8)";
        mgCtx.lineWidth = 1;
        mgCtx.beginPath();
        mgCtx.moveTo(magSize / 2, 0);
        mgCtx.lineTo(magSize / 2, magSize);
        mgCtx.moveTo(0, magSize / 2);
        mgCtx.lineTo(magSize, magSize / 2);
        mgCtx.stroke();
        // center loupe
        //      magCanvas.style.left = (e.clientX - rect.left - magSize/2) + 'px';
        //      magCanvas.style.top  = (e.clientY - rect.top  - magSize/2) + 'px';
        magCanvas.style.left = e.clientX - rect.left + "px";
        magCanvas.style.top = e.clientY - rect.top + "px";
      });
      canvas.addEventListener(
        "mouseleave",
        () => (magCanvas.style.display = "none")
      );

      function handleImgClick(pt) {
        let match;
        if (editing && editing.type === "img") {
          match = matches.find((m) => m.id === editing.id);
          editing = null;
        } else if (
          !matches.length ||
          (matches[matches.length - 1].img && matches[matches.length - 1].map)
        ) {
          match = { id: matches.length + 1 };
          matches.push(match);
        } else match = matches[matches.length - 1];
        match.img = pt;
        draw();
        renderTable();
      }

      // Initialize map & search
      let map, geocoder, elevationService;
      function initMap() {
        map = new google.maps.Map(mapContainer, {
          center: { lat: 38.9, lng: -77.04 },
          zoom: 4,
          mapId: "2e6d1e173674445b90e0edd1",
          // Update to make the cursor not be a "hand" in google maps.
          draggableCursor: 'pointer',   // shows when moving over the map
          draggingCursor: 'grabbing',     // shows when dragging the map (optional)
        });
        geocoder = new google.maps.Geocoder();
        elevationService = new google.maps.ElevationService();

        // Search control
        const searchDiv = document.createElement("div");
        searchDiv.style.cssText =
          "background:#fff;padding:6px;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,0.3);margin:10px;";
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = "Search map...";
        input.style.width = "180px";
        const btn = document.createElement("button");
        btn.textContent = "Go";
        btn.style.marginLeft = "4px";
        searchDiv.append(input, btn);
        map.controls[google.maps.ControlPosition.TOP_LEFT].push(searchDiv);

        btn.addEventListener("click", () => {
          const address = input.value.trim();
          if (!address) return;
          geocoder.geocode({ address }, (results, status) => {
            if (status === "OK" && results[0]) {
              map.setCenter(results[0].geometry.location);
              map.setZoom(15);
            } else {
              alert("Geocode failed: " + status);
            }
          });
        });
        input.addEventListener("keyup", (e) => {
          if (e.key === "Enter") btn.click();
        });

        map.addListener("click", (e) =>
          handleMapClick([e.latLng.lat(), e.latLng.lng()], e.latLng)
        );
      }

      async function getElevation(latlng) {
        try {
          const { results, status } =
            await elevationService.getElevationForLocations({
              locations: [latlng],
            });
          if (results && results[0]) {
            return results[0].elevation;
          }
          return 0;
        } catch (e) {
          return 0;
        }
      }

      async function handleMapClick(latlngArr, latlngObj) {
        let match;
        if (editing && editing.type === "map") {
          match = matches.find((m) => m.id === editing.id);
          editing = null;
        } else if (
          !matches.length ||
          (matches[matches.length - 1].img && matches[matches.length - 1].map)
        ) {
          match = { id: matches.length + 1 };
          matches.push(match);
        } else match = matches[matches.length - 1];
        elevation = await getElevation(latlngObj);
        console.log("Elevation at", latlngArr, "is", elevation);
        latlngArr.push(elevation);
        match.map = latlngArr;
        if (match.marker) match.marker.setMap(null);
        const content = document.createElement("div");
        content.textContent = match.id;
        content.style.cssText =
          `background:${colors[(match.id - 1) % colors.length]};color:white;` +
          `width:24px;height:24px;border-radius:12px;` +
          `display:flex;align-items:center;justify-content:center;`;
        match.marker = new google.maps.marker.AdvancedMarkerElement({
          map,
          position: latlngObj,
          content,
        });
        draw();
        renderTable();
      }

      function draw() {
        if (!img.width) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        matches.forEach((m) => {
          if (m.img) {
            const [x, y] = m.img;
            ctx.fillStyle = colors[(m.id - 1) % colors.length];
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.font = "12px sans-serif";
            ctx.fillText(m.id, x - 4, y + 4);
          }
          // Draw reprojected point from API
          if (m.apiReprojected) {
            const [x, y] = m.apiReprojected;
            ctx.strokeStyle = colors[(m.id - 1) % colors.length];
            ctx.lineWidth = 5;
            ctx.beginPath();
            const l = 20;
            ctx.moveTo(x - l, y - l);
            ctx.lineTo(x + l, y + l);
            ctx.moveTo(x + l, y - l);
            ctx.lineTo(x - l, y + l);
            ctx.stroke();
          }
        });
      }

      function renderTable() {
        tbody.innerHTML = "";
        matches.forEach((m) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
          <td>${m.id}</td>
          <td>${m.img ? `(${m.img[0]},${m.img[1]})` : ""}</td>
          <td>${
            m.map
              ? `(${m.map[0].toFixed(6)},${m.map[1].toFixed(
                  6
                )},${m.map[2].toFixed(6)})`
              : ""
          }</td>
          <td>${
            m.apiReprojected
              ? `(${m.apiReprojected[0].toFixed(
                  1
                )},${m.apiReprojected[1].toFixed(1)})`
              : ""
          }</td>
          <td>
            <button class="btn" data-action="edit-img" data-id="${
              m.id
            }">Edit Img</button>
            <button class="btn" data-action="edit-map" data-id="${
              m.id
            }">Edit Map</button>
            <button class="btn" data-action="delete" data-id="${
              m.id
            }">Delete</button>
          </td>`;
          tbody.appendChild(tr);
        });
      }

      tbody.addEventListener("click", (e) => {
        if (!e.target.matches(".btn")) return;
        const id = +e.target.dataset.id;
        const action = e.target.dataset.action;
        if (action === "delete") {
          const idx = matches.findIndex((m) => m.id === id);
          if (matches[idx].marker) matches[idx].marker.setMap(null);
          matches.splice(idx, 1);
          matches.forEach((m, i) => (m.id = i + 1));
          draw();
          renderMarkers();
          renderTable();
        } else {
          editing = { type: action === "edit-img" ? "img" : "map", id };
        }
      });

      function renderMarkers() {
        matches.forEach((m) => {
          if (m.marker) m.marker.setMap(null);
          m.marker = null;
        });
        matches.forEach((m) => {
          if (m.map) {
            const loc = new google.maps.LatLng(m.map[0], m.map[1]);
            const content = document.createElement("div");
            content.textContent = m.id;
            content.style.cssText =
              `background:${colors[(m.id - 1) % colors.length]};color:white;` +
              `width:24px;height:24px;border-radius:12px;` +
              `display:flex;align-items:center;justify-content:center;`;
            m.marker = new google.maps.marker.AdvancedMarkerElement({
              map,
              position: loc,
              content,
            });
          }
        });
      }

      // --- API Calibration ---
      const calibrateApiBtn = document.getElementById("calibrateApiBtn");
      calibrateApiBtn.addEventListener("click", calibrateWithApi);

      async function calibrateWithApi() {
        const payload = {
          imagePoints: matches.map((m) => m.img),
          worldPoints: matches.map((m) => m.map),
          imageUrl: img.src,
        };

        try {
          const response = await fetch(
            "https://contrails.worldscope.live/calibrate",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            }
          );

          if (!response.ok) {
            const err = await response.json();
            throw new Error(
              err.detail || `HTTP error! status: ${response.status}`
            );
          }

          const results = await response.json();

          // Re-project points using the returned matrices
          const { k_matrix, r_matrix, t_vector, estimated_image_points } =
            results;
          const worldPoints = payload.worldPoints;

          const reprojectedPoints = estimated_image_points;

          // Update matches with reprojected points
          matches.forEach((m, i) => {
            m.apiReprojected = reprojectedPoints[i];
          });

          draw();
          renderTable();
        } catch (error) {
          console.error("API Calibration failed:", error);
          alert("API Calibration failed: " + error.message);
        }
      }

      // --- Matrix Helpers ---
      function matVecMul(matrix, vector) {
        const result = [];
        for (let i = 0; i < matrix.length; i++) {
          let sum = 0;
          for (let j = 0; j < matrix[i].length; j++) {
            sum += matrix[i][j] * vector[j][0];
          }
          result.push([sum]);
        }
        return result;
      }

      function transpose(matrix) {
        return matrix[0].map((_, colIndex) =>
          matrix.map((row) => row[colIndex])
        );
      }

      function downloadFile(blob, filename) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
      exportBtn.addEventListener("click", () => {
        const data = matches.map((m) => ({ id: m.id, img: m.img, map: m.map }));
        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });
        downloadFile(blob, "matches.json");
      });
      function rowToCsv(arr, defaultLen = 3) {
        if (!Array.isArray(arr)) arr = [];
        if (arr.length < defaultLen) {
          arr = arr.concat(Array(defaultLen - arr.length).fill(null));
        }
        return arr.map((v) => (v ? v : "")).join(",");
      }
      exportCsvBtn.addEventListener("click", () => {
        let csv = "id,img_x,img_y,map_lat,map_lng,map_altitude\n";
        matches.forEach((m) => {
          csv += `${m.id},${m.img ? m.img[0] : ""},${
            m.img ? m.img[1] : ""
          },${rowToCsv(m.map)}\n`;
        });
        const blob = new Blob([csv], { type: "text/csv" });
        downloadFile(blob, "matches.csv");
      });

      importBtn.addEventListener("click", () => importFile.click());
      importFile.addEventListener("change", handleFileImport);

      function handleFileImport(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          const content = e.target.result;
          if (file.name.endsWith(".json")) {
            try {
              const importedMatches = JSON.parse(content);
              matches = importedMatches;
            } catch (err) {
              alert("Error parsing JSON file: " + err.message);
              return;
            }
          } else if (file.name.endsWith(".csv")) {
            try {
              const lines = content
                .split("\n")
                .filter((line) => line.trim() !== "");
              const headers = lines[0].split(",").map((h) => h.trim());
              const importedMatches = [];
              for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(",").map((v) => v.trim());
                const match = {};
                headers.forEach((header, index) => {
                  if (values[index]) {
                    if (header === "id") match.id = parseInt(values[index], 10);
                    else if (header === "img_x") {
                      if (!match.img) match.img = [];
                      match.img[0] = parseFloat(values[index]);
                    } else if (header === "img_y") {
                      if (!match.img) match.img = [];
                      match.img[1] = parseFloat(values[index]);
                    } else if (header === "map_lat") {
                      if (!match.map) match.map = [];
                      match.map[0] = parseFloat(values[index]);
                    } else if (header === "map_lng") {
                      if (!match.map) match.map = [];
                      match.map[1] = parseFloat(values[index]);
                    } else if (header === "map_altitude") {
                      if (!match.map) match.map = [];
                      match.map[2] = parseFloat(values[index]);
                    }
                  }
                });
                if (Object.keys(match).length > 0) {
                  importedMatches.push(match);
                }
              }
              matches = importedMatches;
            } catch (err) {
              alert("Error parsing CSV file: " + err.message);
              return;
            }
          }
          renderMarkers();
          draw();
          renderTable();
        };
        reader.readAsText(file);
      }

      // save to localStorage
      // save everty 5 seconds
      setInterval(() => {
        console.log("Saving matches to localStorage...", matches);
        // clone matches
        const matchesToSave = matches.map((m) => ({
          id: m.id,
          img: m.img ? [...m.img] : null,
          map: m.map ? [...m.map] : null,
        }));
        localStorage.setItem("geoCalibMatches", JSON.stringify(matchesToSave));
      }, 5000);
      // load from localStorage
      window.addEventListener("load", () => {
        const saved = localStorage.getItem("geoCalibMatches");
        if (saved) {
          matches = JSON.parse(saved);
          renderMarkers();
          draw();
          renderTable();
        }
      });
    </script>
    <script
      async
      defer
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAnEMLjV3IsEgU7gO-8q3I5psuRv8EaXxA&callback=initMap&libraries=marker"
    ></script>
  </body>
</html>
